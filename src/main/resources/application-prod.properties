spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:1}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DATABASE_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DATABASE_MAX_LIFETIME:300000}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT:30000}
spring.jpa.show-sql=false
server.forward-headers-strategy=framework
