spring.application.name=FreshGuard ColdTrack Platform
spring.profiles.default=dev
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

security.jwt.secret=${JWT_SECRET:coldtrack-development-secret-key-change-me}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200}
